# Azure profile (activated by SPRING_PROFILES_ACTIVE=azure in the ACI deploy).
# Points the datasource at the Azure PostgreSQL flexible server instead of the
# in-memory H2 default in application.properties. Without this file the azure
# profile was a no-op and the deployed app silently ran on ephemeral H2.
#
# DATABASE_PASSWORD is injected as a secure env var from Key Vault
# (secret baleen-test-db-password) and consumed by spring.datasource.password
# in application.properties.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://baleen-test-db.postgres.database.azure.com:5432/baleen?sslmode=require}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DATABASE_USERNAME:baleendbadmin}

# Liquibase manages the schema (incl. PostGIS via 001-create-spatial-extensions),
# Hibernate only validates. Keep validate even though the deploy passes DDL_AUTO.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.platform=postgresql
