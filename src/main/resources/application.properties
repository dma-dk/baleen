# Database Configuration - defaults to H2, configurable via environment variables
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:baleen;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# H2 Console Configuration (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
# Liquid base takes care of creating entities, we should only validate here
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true
spring.liquibase.drop-first=false
spring.liquibase.contexts=${LIQUIBASE_CONTEXTS:default}

# SQL initialization for spatial functions (disabled in favor of Liquibase)
spring.sql.init.mode=never
spring.sql.init.platform=${DATABASE_TYPE:h2}

# Server configuration
server.port=${SERVER_PORT:8080}

# Enable SQL logging (optional)
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# SECOM Configuration
secom.security.ssl.keystore=${KEYSTORE_LOCATION:classpath:secom/keystore-localdev.p12}
secom.security.ssl.keystore-type=PKCS12
secom.security.ssl.keystore-password=${KEYSTORE_PASSWORD:changeit}

secom.security.ssl.truststore=secom/truststore.p12
secom.security.ssl.truststore-type=PKCS12
secom.security.ssl.truststore-password=changeit
secom.security.ssl.insecureSslPolicy=false

# S-100 Part 17 exchange set configuration. The producer code is the four character IHO Producer
# Code Register code used in the dataset file names; the online resource (or an email address) is
# what documents the producing agency contact the catalogue requires. The scheme administrator is
# the identity that issued the data server certificate, which every certificate in the exchange set
# chains up to.
baleen.exchange-set.organization=${EXCHANGE_SET_ORGANIZATION:Danish Maritime Authority}
baleen.exchange-set.producer-code=${EXCHANGE_SET_PRODUCER_CODE:DK00}
baleen.exchange-set.scheme-administrator=${EXCHANGE_SET_SCHEME_ADMINISTRATOR:IHO}
baleen.exchange-set.dataset-mrn-prefix=${EXCHANGE_SET_DATASET_MRN_PREFIX:urn:mrn:dk:dma:s-124}
baleen.exchange-set.online-resource=${EXCHANGE_SET_ONLINE_RESOURCE:https://www.dma.dk}
baleen.exchange-set.emails=${EXCHANGE_SET_EMAILS:}

# SECOM caller authentication. True - the default, and what baleen-test runs with - means SECOM callers are
# NOT authenticated: a caller that presents no client certificate is served as an anonymous node, and one that
# does present a certificate has its MRN read out of the X-Secom-Cert header without the chain, the validity
# period or the truststore ever being checked. Set to false to refuse callers that present no certificate at
# all with 401 Unauthorized. Anything that matters must not run with this set to true.
baleen.secom.allow-anonymous=${SECOM_ALLOW_ANONYMOUS:true}

# Service Registry Configuration
secom.service-registry.url=${SERVICE_REGISTRY_ENDPOINT:https://msr.maritimeconnectivity.net/api/secom}

# Niord Configuration
niord.endpoint=${NIORD_ENDPOINT:https://niord.t-dma.dk}

# Management endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.info.git.enabled=true
management.info.git.mode=full
management.info.build.enabled=true
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true